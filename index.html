
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080910">

    <title>NOVA | Smart Entertainment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">NOVA<span>.</span></div>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#filmes">Filmes</a>
            <a href="#series">Séries</a>
            <a href="#apps">Aplicativos</a>
        </nav>

        <div class="profile">N</div>
    </header>

    <main>
        <section class="hero" id="inicio">
            <div class="hero-content">
                <p class="subtitle">NOVA ORIGINAL</p>

                <h1>Entre em outro universo.</h1>

                <p class="description">
                    Seu entretenimento. Sua experiência.
                    Um novo jeito de assistir.
                </p>

                <button onclick="alert('Bem-vindo ao NOVA!')">
                    Explorar agora
                </button>
            </div>
        </section>

        <section class="content-section" id="filmes">
            <h2>Em destaque</h2>

            <div class="movie-grid">
                <div class="movie-card">NOVA CINEMA</div>
                <div class="movie-card">NOVA SERIES</div>
                <div class="movie-card">NOVA PLAY</div>
                <div class="movie-card">NOVA WORLD</div>
            </div>
        </section>

        <section class="content-section" id="apps">
            <h2>Central NOVA</h2>

            <div class="app-grid">
                <div class="app-card">Aplicativos</div>
                <div class="app-card">NOVA Remote</div>
                <div class="app-card">NOVA Ambient</div>
                <div class="app-card">Configurações</div>
            </div>
        </section>
    </main>

</body>
</html>
