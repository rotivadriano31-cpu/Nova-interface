
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080711">

    <title>NOVA | Smart Launcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="space-background"></div>

    <header class="topbar">
        <div class="logo">NOVA<span>.</span></div>

        <div class="system-info">
            <span class="status">
                <span class="status-dot"></span>
                Sistema online
            </span>
            <span id="clock">00:00</span>
            <button class="settings-button" aria-label="Configurações">⚙</button>
        </div>
    </header>

    <main class="dashboard">

      <section class="welcome">
    <p class="eyebrow">YOUR DIGITAL UNIVERSE</p>
    <h1>Bem-vindo,<br><span>Vitor.</span></h1>
    <p class="welcome-description">
        Seu universo digital, do seu jeito.
    </p>
</section>

        <section class="favorites">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">ACESSO RÁPIDO</p>
                    <h2>Mais utilizados</h2>
                </div>
                <span class="section-caption">SEUS FAVORITOS</span>
            </div>

            <div class="app-grid">

                <button class="app-card" tabindex="0">
                    <span class="app-icon youtube">▶</span>
                    <span>YouTube</span>
                </button>

                <button class="app-card" tabindex="0">
                    <span class="app-icon streaming">N</span>
                    <span>Streaming</span>
                </button>

                <button class="app-card" tabindex="0">
                    <span class="app-icon browser">◎</span>
                    <span>Navegador</span>
                </button>

                <button class="app-card" tabindex="0">
                    <span class="app-icon music">♫</span>
                    <span>Música</span>
                </button>

            </div>
        </section>

        <section class="library">
            <div class="library-info">
                <div>
                    <p class="eyebrow">SUA BIBLIOTECA</p>
                    <h2>Meus aplicativos</h2>
                </div>

                <button class="library-button" tabindex="0">
                    <span>▦</span>
                    Ver todos
                </button>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>NOVA SMART LAUNCHER</span>
        <span>EXPLORE YOUR UNIVERSE</span>
    </footer>

    <script src="app.js"></script>

</body>
</html>
